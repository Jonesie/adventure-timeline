name: Release

# Push a tag like v1.2.0 to build, sign and publish a release.
#   git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version from the tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CORE="${VERSION%%-*}"            # drop any -rc1 style suffix
          IFS=. read -r MAJOR MINOR PATCH <<< "$CORE"
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$PATCH" ]; then
            echo "Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          # versionCode must only ever go up; 1.2.3 -> 10203
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (versionCode $CODE)"

      - name: Check signing secrets are set
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing secret $name (see docs/RELEASING.md)"; exit 1; fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Decode the signing key
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed bundle and APK
        run: >
          ./gradlew bundleRelease assembleRelease --stacktrace
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Check the build is signed
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME"/build-tools/*/apksigner verify --verbose "$APK" | head -5

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.name }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk

      # Optional: runs only if the PLAY_SERVICE_ACCOUNT_JSON secret exists. Goes to the internal test
      # track as a draft so nothing reaches users until you promote it in Play Console.
      - name: Upload to Google Play (internal track)
        if: env.HAS_PLAY_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: net.jonesie.traveldiary
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: draft
